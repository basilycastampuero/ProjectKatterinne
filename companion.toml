# Configuracion del Local Companion.
# Copia este fichero a companion.local.toml para ajustes personales
# (ese nombre esta en .gitignore).
#
# Precedencia: defaults -> este TOML -> variables COMPANION_* -> flags CLI.
# Ejemplo de override por entorno:  COMPANION_LLM_MODEL=llama3.1:8b

[llm]
provider = "ollama"
host = "http://127.0.0.1:11434"

# 8.2B en Q4_K_M (~5.2 GB): entra entero en los 8 GB de la RTX 4070 Laptop,
# que es el requisito de CLAUDE.md secciones 2 y 33. Sigue siendo provisional
# hasta el benchmark de la seccion 37, pero ya cumple el rango 4B-8B de la 7.
model = "qwen3:8b"

temperature = 0.7

# Contexto de trabajo. Subirlo agranda el KV cache en VRAM: 4096 deja margen
# de sobra en 8 GB. El modelo admite hasta 40960.
num_ctx = 4096

# Cuanto tiempo mantiene Ollama el modelo en VRAM tras el ultimo mensaje.
keep_alive = "5m"

# Razonamiento explicito. Desactivado a proposito: medido en qwen3:8b, generar
# "¡Hola!" costaba 319 tokens (~310 de razonamiento interno, en ingles) y ~5.5s
# hasta la primera palabra. Para conversar no compensa. Los modelos que no
# declaran la capacidad `thinking` ignoran este ajuste.
think = false

request_timeout_s = 120.0
connect_timeout_s = 5.0

[conversation]
# Turnos user/assistant que viajan al modelo (CLAUDE.md seccion 25).
max_history_messages = 20

[perception]
# Cada cuanto se pregunta que ventana tiene el foco. Medido en el equipo
# objetivo: 26 microsegundos por sondeo, o sea 0.0026% de un nucleo a un
# sondeo por segundo. No hay capturas de pantalla en esta fase.
poll_interval_s = 1.0

# Procesos que no cuentan como contexto ni como actividad.
#
# Pon aqui el terminal desde el que la lanzas. Si no, mientras le hablas la
# ventana en primer plano es ese terminal, el contexto pasa a ser
# "Windows Terminal" y no le queda nada interesante que preguntar.
#
# Ejemplos segun donde la ejecutes:
#   ignore_processes = ["WindowsTerminal.exe"]
#   ignore_processes = ["WindowsTerminal.exe", "Code.exe"]   # terminal del IDE
ignore_processes = ["WindowsTerminal.exe"]

[memory]
# Con false la aplicacion funciona igual pero no escribe nada en disco.
# Tambien se puede apagar solo para una ejecucion con:  --no-memory
enabled = true

# Fichero SQLite, relativo a data_dir. Esta dentro de data/, que va entero
# en .gitignore.
database = "memory.db"

# Segundos minimos entre dos cambios de ventana registrados. Cambiar de
# archivo pasa cada pocos segundos: guardarlos todos seria ruido.
min_window_change_interval_s = 60.0

# Cuanto vive un recuerdo efimero antes de caducar solo (30 minutos).
ephemeral_ttl_s = 1800.0

# Confianza minima para guardar una inferencia. Lo que digas tu entra
# siempre, sin umbral.
min_confidence_to_store = 0.3

# Cuantos recuerdos se le pasan al modelo en cada turno (CLAUDE.md 25).
recall_limit = 5

[curiosity]
# Cuando se le permite iniciar una conversacion. Estos numeros existen para
# que se calle, no para que hable: CLAUDE.md seccion 19 considera que una
# sesion de dos horas con UNA pregunta es buena, y con cuarenta y siete es
# mala.
enabled = true

# Puntuacion minima. Esta calibrada para que ninguna señal suelta baste:
# hacen falta al menos dos cosas a la vez.
threshold = 6

# Veinte minutos entre preguntas.
min_seconds_between_questions = 1200.0

# Cuanto lleva en el mismo sitio antes de poder preguntar. Interrumpir nada
# mas cambiar de ventana es justo lo molesto.
min_seconds_in_context = 120.0

# Por debajo de esta confianza del contexto no se sabe lo suficiente para
# decir algo que no sea vago.
min_context_confidence = 0.5

# Preguntas como mucho por sesion.
max_questions_per_session = 4

# Seis horas sin ver un proyecto: al volver, cuenta como novedad.
absence_seconds = 21600.0

# Palabras como mucho por pregunta. Una pregunta larga casi siempre son dos
# preguntas disfrazadas.
max_question_words = 25

# Si la pregunta del modelo no pasa el filtro, se recurre a una plantilla
# determinista. Poner false para medir cuantas veces falla el modelo.
allow_template_fallback = true

[privacy]
# Interruptor general. Con true no se observa el titulo de NINGUNA ventana.
# Tambien se puede activar solo para una ejecucion con:  --privacy
privacy_mode = false

# Procesos cuyo titulo nunca se observa ni se registra. Se comparan sin
# distinguir mayusculas y da igual si escribes la extension ".exe".
#
# Llega vacia a proposito: CLAUDE.md seccion 22 prohibe asumir que
# aplicaciones usa cada persona. Rellenala tu. Ejemplos del tipo de cosa
# que suele ir aqui (gestor de contraseñas, banca, mensajeria privada):
#
#   blocked_processes = ["1password.exe", "keepass.exe", "signal.exe"]
blocked_processes = []

[logging]
level = "INFO"
to_file = true
filename = "companion.log"
